name: Verify and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform_ci
          POSTGRES_PASSWORD: ci_ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_ci -d platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check patch whitespace
        run: git -c core.whitespace=trailing-space,space-before-tab diff-tree --check --root -r HEAD
      - name: Build and run tests on H2
        run: mvn -B verify
      - name: Run tests on PostgreSQL
        run: mvn -B test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/platform_test
          TEST_DB_USER: platform_ci
          TEST_DB_PASSWORD: ci_ephemeral
      - name: Build container
        run: docker build -t course-platform .
      - uses: actions/upload-artifact@v4
        with:
          name: course-platform
          path: target/course-platform-*.jar
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
